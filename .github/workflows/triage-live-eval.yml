# Live evaluation of AI complaint triage on serverless/evals/triage/dataset.json.
# Makes 50 real Gemini calls, so it only runs when started by hand.
#   1. Add the repository secret GEMINI_API_KEY.
#   2. Set the repository variable ENABLE_LIVE_EVAL to "true".
#   3. Actions -> "Triage live evaluation" -> Run workflow.
name: Triage live evaluation

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-eval:
    if: vars.ENABLE_LIVE_EVAL == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - run: npm ci
      - name: Run the live evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: npm run eval:triage:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-live-report
          path: serverless/reports/triage-live-*.md
          if-no-files-found: ignore
